<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Fundação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícone para abas do navegador, favoritos e atalhos -->
    <link rel="icon" href="{{ url_for('static', filename='icone.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icone.png') }}">

    <link rel="manifest" href="{{ url_for('static', filename='manifest_veiculos.json') }}?v=4">
</head>
<body class="bg-light">

    <!-- CABEÇALHO -->
    <header class="container mt-4 mb-4 text-center">
        <a href="/veiculos">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Fundação Funcabes" style="max-height: 45px; object-fit: contain;">
        </a>
    </header>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- MENSAGENS FLUTUANTES -->
                <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1100; width: 100%; max-width: 400px; margin-top: 20px;">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show shadow-lg fw-bold text-center border-0 mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                </div>

                <!-- CAIXA DE LOGIN DO GESTOR -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-dark text-white text-center py-4 border-0 rounded-top-4">
                        <h4 class="mb-0 fw-bold">⚙️ Acesso Restrito (Gestor)</h4>
                    </div>
                    
                    <div class="card-body p-4 p-md-5">
                        <form method="POST" action="/login_admin">
                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary">🔑 Senha de Acesso</label>
                                <!-- Adicionado o atributo 'autofocus' para o cursor já cair direto aqui piscando -->
                                <input type="password" class="form-control form-control-lg bg-light border-0 shadow-sm text-center" name="senha" placeholder="••••••••" required autofocus>
                            </div>
                            <button type="submit" class="btn btn-dark w-100 btn-lg fw-bold shadow-sm mt-2 mb-3">Acessar Painel</button>
                        </form>
                        
                        <div class="text-center mt-4 border-top pt-4">
                            <a href="/veiculos" class="text-decoration-none text-muted fw-bold">⬅ Voltar para Tela do Motorista</a>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
