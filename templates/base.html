<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Define that the document is HTML5 -->
    <meta charset="UTF-8">
    
    <!-- CRUCIAL FOR MOBILE: This line tells the browser to scale the page to the width of the device screen (cellphone, tablet, PC). Without this, the app will look tiny on a phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Controle de Frota - Fundação</title>
    
    <!-- BOOTSTRAP: This link imports a pre-written CSS file from the internet. Bootstrap provides ready-to-use styles for buttons, cards, and layouts, saving us from writing hundreds of lines of CSS manually. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- class="bg-light" is a Bootstrap class that gives the whole page a light gray background instead of pure white -->
<body class="bg-light">

    <!-- NAVIGATION BAR: The dark bar at the top of the app -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <!-- class="container" keeps the content centered and stops it from stretching to the very edges of wide screens -->
        <div class="container">
            <!-- The logo/title in the top bar. The href="/" means clicking it takes you back to the home page -->
            <a class="navbar-brand" href="/">🚗 Controle de Frota</a>
        </div>
    </nav>

    <!-- MAIN CONTENT AREA -->
    <div class="container">
        <!-- THIS IS THE MAGIC JINJA2 COMMAND: 
             This line tells Flask: "Whenever another HTML file extends this base file, inject its specific content right here." -->
        {% block content %}{% endblock %}
    </div>

</body>
</html>
