<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Fundação Funcabes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ícone para abas do navegador, favoritos e atalhos -->
    <link rel="icon" href="{{ url_for('static', filename='icone.png') }}" type="image/png">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icone.png') }}">

    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}?v=4">
</head>
<body class="bg-light">

    <!-- CABEÇALHO -->
    <header class="container mt-4 mb-4 position-relative text-center">
        <a href="/motorista">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Fundação Funcabes" style="max-height: 45px; object-fit: contain;">
        </a>
    </header>

    <div class="container mt-4 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">

                <!-- MENSAGENS FLUTUANTES -->
                <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 1100; width: 100%; max-width: 400px; margin-top: 20px;">
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show shadow-lg fw-bold text-center border-0 mb-3" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                </div>

                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-header bg-dark text-white text-center py-4 border-0 rounded-top-4">
                        <h4 class="mb-0 fw-bold">📝 Cadastro de Usuário</h4>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <form method="POST" action="/cadastro">

                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Nome Completo</label>
                                <input type="text" class="form-control bg-light border-0 shadow-sm" name="nome" placeholder="Ex: João da Silva" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6 mb-3 mb-md-0">
                                    <label class="form-label fw-bold text-secondary">Login de Acesso</label>
                                    <input type="text" class="form-control bg-light border-0 shadow-sm" name="login" placeholder="Ex: joao.silva" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Validade da CNH</label>
                                    <input type="date" class="form-control bg-light border-0 shadow-sm text-secondary" name="cnh_validade" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold text-secondary">Setor da Fundação</label>
                                <select class="form-select bg-light border-0 shadow-sm text-secondary" name="setor" required>
                                    <option value="" disabled selected>Selecione seu Setor...</option>
                                    <option value="Contabilidade">Contabilidade</option>
                                    <option value="Coordenação">Coordenação</option>
                                    <option value="Financeiro">Financeiro</option>
                                    <option value="Jurídico">Jurídico</option>
                                    <option value="Licitação">Licitação</option>
                                    <option value="Motoristas">Motoristas</option>
                                    <option value="Sesmt">Sesmt</option>
                                    <option value="Pedagógico">Pedagógico</option>
                                    <option value="Planejamento">Planejamento</option>
                                    <option value="Recursos Humanos">Recursos Humanos</option>
                                    <option value="Sede">Sede</option>
                                    <option value="TI">TI</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold text-secondary">Senha</label>
                                <input type="password" class="form-control bg-light border-0 shadow-sm" name="senha" placeholder="Crie uma senha segura" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold shadow-sm mt-2 mb-3">Realizar Cadastro</button>

                        </form>

                        <div class="text-center mt-4 border-top pt-4">
                            <span class="text-muted">Já tem uma conta?</span>
                            <a href="/login" class="text-decoration-none fw-bold ms-1">Faça Login aqui</a>
                            <br><br>
                            <a href="/veiculos" class="text-decoration-none text-muted fw-bold">⬅ Voltar para a Tela Inicial</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
